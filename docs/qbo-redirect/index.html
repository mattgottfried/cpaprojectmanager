<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connecting to CPA Manager…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f2f2f7;
      color: #1c1c1e;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 360px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p { font-size: 14px; color: #6e6e73; }
    a { color: #0b5c9d; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connecting to QuickBooks…</h1>
    <p id="message">Returning you to CPA Manager.</p>
    <p><a id="fallback" href="#" style="display:none;">Tap here if you're not redirected automatically</a></p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var target = new URLSearchParams();
      ["code", "realmId", "state", "error", "error_description"].forEach(function (key) {
        var value = params.get(key);
        if (value !== null) target.set(key, value);
      });
      var redirectURL = "cpamanager://qbo-callback?" + target.toString();

      var fallback = document.getElementById("fallback");
      fallback.href = redirectURL;

      if (params.get("error")) {
        document.getElementById("message").textContent =
          "QuickBooks authorization was not completed. You can close this page and try again in the app.";
      } else {
        window.location.href = redirectURL;
        setTimeout(function () {
          fallback.style.display = "inline";
        }, 1500);
      }
    })();
  </script>
</body>
</html>
