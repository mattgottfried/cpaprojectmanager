name: CPAManager
options:
  bundleIdPrefix: com.gottfriedcpa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: X796Z5UW4P

targets:
  CPAManager:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: CPAManager
        excludes:
          - "Entitlements/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gottfriedcpa.ProjectManager
        CODE_SIGN_ENTITLEMENTS: CPAManager/Entitlements/CPAManager.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: CPAManager/Info.plist
      properties:
        CFBundleDisplayName: CPA Manager
        LSApplicationCategoryType: public.app-category.business
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSRemindersFullAccessUsageDescription: "CPA Manager can import your existing Apple Reminders workflow (clients, projects, and recurring work) into the app. Nothing in Reminders is changed or deleted."
        NSCameraUsageDescription: "CPA Manager uses the camera to scan documents and attach them to a client or project."
        NSCalendarsWriteOnlyAccessUsageDescription: "CPA Manager can add a deadline to your calendar when you tap \"Add to Calendar.\" It doesn't read your existing calendar events."
        CFBundleURLTypes:
          - CFBundleURLName: com.gottfriedcpa.ProjectManager
            CFBundleURLSchemes:
              - cpamanager
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      # XcodeGen only accepts `all`, `iOS`, or `macOS` here (case-sensitive) — a
      # lowercase `ios` is silently ignored and the .appex gets embedded on Catalyst too.
      - target: CPAShare
        platformFilter: iOS
      # Apple Watch companion (iPhone only — Catalyst has no paired Watch).
      - target: CPAWatch
        platformFilter: iOS
      - target: CPAWidgets
        # CPAWidgets is iOS-only (Live Activities/widgets have no Mac Catalyst
        # equivalent) — without this filter, Xcode refuses to embed an iOS-only
        # .appex in a Mac Catalyst host at all ("built for macOS but contains
        # embedded content built for iOS").
        platformFilter: iOS

  CPAWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CPAWidgets
        excludes:
          - "*.entitlements"
      # Shared source compiled into BOTH the app and the widget extension:
      - path: CPAManager/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gottfriedcpa.ProjectManager.Widgets
        CODE_SIGN_ENTITLEMENTS: CPAWidgets/CPAWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: CPAWidgets/Info.plist
      properties:
        CFBundleDisplayName: CPA Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Apple Watch companion: shows today's tasks, completes them, starts/stops the timer.
  # Talks to the iPhone app over WatchConnectivity; never opens the CloudKit store.
  CPAWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CPAWatch
      - path: CPAManager/Shared/WatchPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gottfriedcpa.ProjectManager.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CPA Manager
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.gottfriedcpa.ProjectManager
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO

  CPAManagerTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: CPAManagerTests
    dependencies:
      - target: CPAManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gottfriedcpa.ProjectManager.Tests
        GENERATE_INFOPLIST_FILE: YES

  CPAShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CPAShare
        excludes:
          - "*.entitlements"
      # Only the App Group + queue definitions are needed, not the whole Shared folder
      # (the timer's ActivityKit types etc. have no business in a share extension).
      - path: CPAManager/Shared/AppGroup.swift
      - path: CPAManager/Shared/PendingCaptures.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gottfriedcpa.ProjectManager.Share
        CODE_SIGN_ENTITLEMENTS: CPAShare/CPAShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: CPAShare/Info.plist
      properties:
        CFBundleDisplayName: Add to CPA Inbox
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsImageWithMaxCount: 5

  # Native macOS app (not Catalyst): same sources, sidebar layout, menu bar quick
  # capture, ⌃⌥Space hotkey. Same bundle ID + CloudKit container as the iOS app, so
  # the data syncs. Module name stays "CPAManager" so the shared tests import it.
  CPAManagerMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CPAManager
        excludes:
          - "Entitlements/*.entitlements"
          # Generated by the iOS target's `info:` block; the Mac app has its own.
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gottfriedcpa.ProjectManager
        PRODUCT_NAME: CPAManager
        PRODUCT_MODULE_NAME: CPAManager
        CODE_SIGN_ENTITLEMENTS: CPAManagerMac/CPAManagerMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: CPAManagerMac/Info.plist
      properties:
        CFBundleDisplayName: CPA Manager
        LSApplicationCategoryType: public.app-category.business
        ITSAppUsesNonExemptEncryption: false
        NSRemindersFullAccessUsageDescription: "CPA Manager can import your existing Apple Reminders workflow (clients, projects, and recurring work) into the app. Nothing in Reminders is changed or deleted."
        CFBundleURLTypes:
          - CFBundleURLName: com.gottfriedcpa.ProjectManager
            CFBundleURLSchemes:
              - cpamanager

  CPAManagerMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CPAManagerTests
    dependencies:
      - target: CPAManagerMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gottfriedcpa.ProjectManager.MacTests
        GENERATE_INFOPLIST_FILE: YES
