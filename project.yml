name: CPAManager
options:
  bundleIdPrefix: com.gottfriedcpa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # ↓↓↓ Set this to your Apple Developer Team ID (Xcode > Settings > Accounts),
    #     or just pick your team in the Signing & Capabilities tab after generating.
    DEVELOPMENT_TEAM: ""

targets:
  CPAManager:
    type: application
    platform: iOS
    sources:
      - path: CPAManager
        excludes:
          - "Entitlements/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gottfriedcpa.ProjectManager
        CODE_SIGN_ENTITLEMENTS: CPAManager/Entitlements/CPAManager.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: CPAManager/Info.plist
      properties:
        CFBundleDisplayName: CPA Manager
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: CPAWidgets

  CPAWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CPAWidgets
        excludes:
          - "*.entitlements"
      # Shared source compiled into BOTH the app and the widget extension:
      - path: CPAManager/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gottfriedcpa.ProjectManager.Widgets
        CODE_SIGN_ENTITLEMENTS: CPAWidgets/CPAWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: CPAWidgets/Info.plist
      properties:
        CFBundleDisplayName: CPA Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
